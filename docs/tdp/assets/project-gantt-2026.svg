<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .axis { font: 700 18px Arial, sans-serif; fill: #111827; }
      .row { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #374151; }
      .grid { stroke: #d1d5db; stroke-width: 1; }
      .box { stroke: #111827; stroke-width: 2; rx: 9; }
      .gate { fill: #ffffff; stroke: #111827; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f9fafb"/>
  <text x="800" y="55" text-anchor="middle" class="title">Visual Project Timeline and Reliability Gates</text>

  <line x1="320" y1="100" x2="1520" y2="100" class="grid"/>
  <line x1="320" y1="680" x2="1520" y2="680" class="grid"/>
  <g>
    <line x1="320" y1="100" x2="320" y2="680" class="grid"/>
    <line x1="500" y1="100" x2="500" y2="680" class="grid"/>
    <line x1="680" y1="100" x2="680" y2="680" class="grid"/>
    <line x1="860" y1="100" x2="860" y2="680" class="grid"/>
    <line x1="1040" y1="100" x2="1040" y2="680" class="grid"/>
    <line x1="1220" y1="100" x2="1220" y2="680" class="grid"/>
    <line x1="1400" y1="100" x2="1400" y2="680" class="grid"/>
    <line x1="1520" y1="100" x2="1520" y2="680" class="grid"/>
  </g>

  <text x="410" y="87" text-anchor="middle" class="axis">2023</text>
  <text x="590" y="87" text-anchor="middle" class="axis">2024</text>
  <text x="770" y="87" text-anchor="middle" class="axis">2025</text>
  <text x="950" y="87" text-anchor="middle" class="axis">Feb-Mar 2026</text>
  <text x="1130" y="87" text-anchor="middle" class="axis">Apr 2026</text>
  <text x="1310" y="87" text-anchor="middle" class="axis">May-Jun 2026</text>
  <text x="1460" y="87" text-anchor="middle" class="axis">Jul 2026</text>

  <text x="70" y="150" class="row">Prototype and first pickup</text>
  <rect x="330" y="125" width="150" height="36" fill="#bae6fd" class="box"/>
  <text x="405" y="149" text-anchor="middle" class="small">line + pickup concept</text>

  <text x="70" y="230" class="row">3D mechanical redesign</text>
  <rect x="510" y="205" width="160" height="36" fill="#bbf7d0" class="box"/>
  <text x="590" y="229" text-anchor="middle" class="small">CAD + printable modules</text>

  <text x="70" y="310" class="row">PCB and electronics</text>
  <rect x="560" y="285" width="260" height="36" fill="#fecaca" class="box"/>
  <text x="690" y="309" text-anchor="middle" class="small">custom PCB + power tree</text>

  <text x="70" y="390" class="row">RPi + Teensy integration</text>
  <rect x="690" y="365" width="250" height="36" fill="#ddd6fe" class="box"/>
  <text x="815" y="389" text-anchor="middle" class="small">UART states + service path</text>

  <text x="70" y="470" class="row">AI rescue model path</text>
  <rect x="760" y="445" width="235" height="36" fill="#fde68a" class="box"/>
  <rect x="1020" y="445" width="315" height="36" fill="#fcd34d" class="box"/>
  <text x="877" y="469" text-anchor="middle" class="small">first detector connected</text>
  <text x="1177" y="469" text-anchor="middle" class="small">dataset expansion + TFLite optimization</text>

  <text x="70" y="550" class="row">Reliability sprint</text>
  <rect x="1080" y="525" width="300" height="36" fill="#a7f3d0" class="box"/>
  <text x="1230" y="549" text-anchor="middle" class="small">timeouts, recovery, T-001/T-002 logs</text>

  <text x="70" y="630" class="row">TDP and final evidence</text>
  <rect x="1200" y="605" width="310" height="36" fill="#bfdbfe" class="box"/>
  <text x="1355" y="629" text-anchor="middle" class="small">figures, TEST_LOG, official PDF</text>

  <polygon points="500,680 515,700 500,720 485,700" class="gate"/>
  <text x="500" y="740" text-anchor="middle" class="small">Gate: stable CAD</text>
  <polygon points="860,680 875,700 860,720 845,700" class="gate"/>
  <text x="860" y="740" text-anchor="middle" class="small">Gate: UART states</text>
  <polygon points="1220,680 1235,700 1220,720 1205,700" class="gate"/>
  <text x="1220" y="740" text-anchor="middle" class="small">Gate: service logs</text>
  <polygon points="1400,680 1415,700 1400,720 1385,700" class="gate"/>
  <text x="1400" y="740" text-anchor="middle" class="small">Gate: final PDF</text>
</svg>
