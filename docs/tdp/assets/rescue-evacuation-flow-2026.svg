<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="940" viewBox="0 0 1700 940">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1f2933"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f8fafc; stroke: #111827; stroke-width: 2.3; }
      .vision { fill: #eff6ff; stroke: #111827; stroke-width: 2.3; }
      .decision { fill: #fefce8; stroke: #111827; stroke-width: 2.3; }
      .teensy { fill: #ecfdf5; stroke: #111827; stroke-width: 2.3; }
      .warn { fill: #fff7ed; stroke: #111827; stroke-width: 2.3; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #111827; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #374151; }
      .arrow { stroke: #1f2933; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1700" height="940"/>
  <text class="title" x="850" y="54" text-anchor="middle">Rescue and Evacuation Flow Diagram</text>

  <rect class="box" x="70" y="105" width="220" height="90" rx="16"/>
  <text class="label" x="180" y="140" text-anchor="middle">Rescue Start</text>
  <text class="small" x="100" y="170">silver line or 0xF1</text>

  <rect class="vision" x="360" y="95" width="280" height="110" rx="16"/>
  <text class="label" x="500" y="130" text-anchor="middle">Frame Pipeline</text>
  <text class="small" x="388" y="160">capture thread</text>
  <text class="small" x="388" y="188">resize to 256 x 256</text>

  <rect class="vision" x="715" y="95" width="310" height="110" rx="16"/>
  <text class="label" x="870" y="130" text-anchor="middle">Lighting Robustness</text>
  <text class="small" x="742" y="160">anti-flash V&gt;=215 and S&lt;=60</text>
  <text class="small" x="742" y="188">AGCWD histogram correction</text>

  <rect class="vision" x="1100" y="95" width="310" height="110" rx="16"/>
  <text class="label" x="1255" y="130" text-anchor="middle">Detector and Tracker</text>
  <text class="small" x="1128" y="160">TFLite inference every 3 frames</text>
  <text class="small" x="1128" y="188">CentroidTracker max_lost = 8</text>

  <rect class="decision" x="95" y="300" width="250" height="125" rx="18"/>
  <text class="label" x="220" y="334" text-anchor="middle">Current RPi State?</text>
  <text class="small" x="130" y="364">rescue: victims only</text>
  <text class="small" x="130" y="392">deposit: zones only</text>

  <rect class="decision" x="425" y="300" width="245" height="125" rx="18"/>
  <text class="label" x="548" y="334" text-anchor="middle">Target Found?</text>
  <text class="small" x="462" y="364">select closest stable box</text>
  <text class="small" x="462" y="392">else rotate/search</text>

  <rect class="decision" x="750" y="300" width="250" height="125" rx="18"/>
  <text class="label" x="875" y="334" text-anchor="middle">Centered and Close?</text>
  <text class="small" x="785" y="364">center tolerance in pixels</text>
  <text class="small" x="785" y="392">width-ratio stop threshold</text>

  <rect class="box" x="1080" y="300" width="285" height="125" rx="18"/>
  <text class="label" x="1222" y="334" text-anchor="middle">RPi Command Mapping</text>
  <text class="small" x="1110" y="364">victim: green_state 6 or 7</text>
  <text class="small" x="1110" y="392">deposit zone: green_state 8 or 9</text>

  <rect class="warn" x="1430" y="300" width="220" height="125" rx="18"/>
  <text class="label" x="1540" y="334" text-anchor="middle">Serial Monitor</text>
  <text class="small" x="1460" y="364">boot/stop/deposit/evac</text>
  <text class="small" x="1460" y="392">can interrupt rescue</text>

  <rect class="teensy" x="95" y="540" width="265" height="130" rx="16"/>
  <text class="label" x="228" y="575" text-anchor="middle">Pickup Black/Silver</text>
  <text class="small" x="125" y="605">lower, sort side, close</text>
  <text class="small" x="125" y="633">lift, release to storage</text>
  <text class="small" x="125" y="661">ball_counter++</text>

  <rect class="teensy" x="435" y="540" width="265" height="130" rx="16"/>
  <text class="label" x="568" y="575" text-anchor="middle">Deposit Request</text>
  <text class="small" x="465" y="605">after 3 collected victims</text>
  <text class="small" x="465" y="633">Teensy sends 0xF8</text>
  <text class="small" x="465" y="661">RPi tracks red/green zones</text>

  <rect class="teensy" x="775" y="540" width="265" height="130" rx="16"/>
  <text class="label" x="908" y="575" text-anchor="middle">Wall Align and Deposit</text>
  <text class="small" x="805" y="605">rotate 180 deg</text>
  <text class="small" x="805" y="633">back until FCL and FCR</text>
  <text class="small" x="805" y="661">release left/right</text>

  <rect class="teensy" x="1115" y="540" width="265" height="130" rx="16"/>
  <text class="label" x="1248" y="575" text-anchor="middle">Evacuation Start</text>
  <text class="small" x="1145" y="605">after two deposits</text>
  <text class="small" x="1145" y="633">Teensy sends 0xF7</text>
  <text class="small" x="1145" y="661">relay off, exit search</text>

  <rect class="teensy" x="1450" y="540" width="210" height="130" rx="16"/>
  <text class="label" x="1555" y="575" text-anchor="middle">Exit Behavior</text>
  <text class="small" x="1477" y="605">APDS black/silver</text>
  <text class="small" x="1477" y="633">ToF wall transitions</text>
  <text class="small" x="1477" y="661">turn and leave zone</text>

  <rect class="box" x="500" y="765" width="700" height="95" rx="18"/>
  <text class="label" x="850" y="799" text-anchor="middle">Failure Handling</text>
  <text class="small" x="535" y="831">If no target is stable, RPi searches slowly; if stop bytes or switch-off occur, both controllers stop safely.</text>

  <path class="arrow" d="M290 150 L360 150"/>
  <path class="arrow" d="M640 150 L715 150"/>
  <path class="arrow" d="M1025 150 L1100 150"/>
  <path class="arrow" d="M1255 205 C1255 255 220 255 220 300"/>
  <path class="arrow" d="M345 362 L425 362"/>
  <path class="arrow" d="M670 362 L750 362"/>
  <path class="arrow" d="M1000 362 L1080 362"/>
  <path class="arrow" d="M1365 362 L1430 362"/>
  <path class="arrow" d="M1222 425 C1222 495 228 495 228 540"/>
  <path class="arrow" d="M360 605 L435 605"/>
  <path class="arrow" d="M700 605 L775 605"/>
  <path class="arrow" d="M1040 605 L1115 605"/>
  <path class="arrow" d="M1380 605 L1450 605"/>
  <path class="arrow" d="M850 670 L850 765"/>
  <path class="soft" d="M548 425 C548 480 875 480 875 425"/>
  <path class="soft" d="M1540 425 C1540 735 1160 735 1160 810"/>

  <text class="tiny" x="610" y="485">no target -> search speed 10, angle 90</text>
  <text class="tiny" x="1015" y="485">target close -> task byte</text>
  <text class="tiny" x="1280" y="735">interrupt path</text>
</svg>
