<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="920" viewBox="0 0 1700 920">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1f2933"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f8fafc; stroke: #111827; stroke-width: 2.3; }
      .decision { fill: #fefce8; stroke: #111827; stroke-width: 2.3; }
      .action { fill: #eff6ff; stroke: #111827; stroke-width: 2.3; }
      .teensy { fill: #ecfdf5; stroke: #111827; stroke-width: 2.3; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #111827; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #374151; }
      .arrow { stroke: #1f2933; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1700" height="920"/>
  <text class="title" x="850" y="54" text-anchor="middle">Line Following Decision Flow Diagram</text>

  <rect class="box" x="72" y="112" width="215" height="84" rx="16"/>
  <text class="label" x="180" y="145" text-anchor="middle">Run Start</text>
  <text class="small" x="100" y="174">state = waiting</text>

  <rect class="box" x="350" y="112" width="250" height="84" rx="16"/>
  <text class="label" x="475" y="145" text-anchor="middle">Teensy Ready</text>
  <text class="small" x="375" y="174">0xF9 changes RPi to line</text>

  <rect class="action" x="665" y="102" width="285" height="104" rx="16"/>
  <text class="label" x="807" y="137" text-anchor="middle">Capture and Normalize</text>
  <text class="small" x="690" y="166">rotate 180 deg</text>
  <text class="small" x="690" y="193">resize to 160 x 120 px</text>

  <rect class="action" x="1015" y="102" width="300" height="104" rx="16"/>
  <text class="label" x="1165" y="137" text-anchor="middle">Build Vision Masks</text>
  <text class="small" x="1040" y="166">black line, green, red, silver</text>
  <text class="small" x="1040" y="193">LAB/HSV/OpenCV thresholds</text>

  <rect class="action" x="1390" y="102" width="245" height="104" rx="16"/>
  <text class="label" x="1512" y="137" text-anchor="middle">Compute Motion</text>
  <text class="small" x="1415" y="166">line vector -> angle</text>
  <text class="small" x="1415" y="193">speed default = 40</text>

  <rect class="decision" x="90" y="298" width="220" height="120" rx="18"/>
  <text class="label" x="200" y="332" text-anchor="middle">Green Marker?</text>
  <text class="small" x="122" y="362">validate black reference</text>
  <text class="small" x="122" y="389">left/right/double marker</text>

  <rect class="decision" x="385" y="298" width="220" height="120" rx="18"/>
  <text class="label" x="495" y="332" text-anchor="middle">Red Line?</text>
  <text class="small" x="420" y="362">count red row bands</text>
  <text class="small" x="420" y="389">single or double stop line</text>

  <rect class="decision" x="680" y="298" width="220" height="120" rx="18"/>
  <text class="label" x="790" y="332" text-anchor="middle">Silver Entry?</text>
  <text class="small" x="715" y="362">vision contour area > 50</text>
  <text class="small" x="715" y="389">or APDS confirms plateado</text>

  <rect class="decision" x="975" y="298" width="230" height="120" rx="18"/>
  <text class="label" x="1090" y="332" text-anchor="middle">Front Obstacle?</text>
  <text class="small" x="1012" y="362">HC-SR04 front distance</text>
  <text class="small" x="1012" y="389">trigger below 12 cm</text>

  <rect class="decision" x="1280" y="298" width="250" height="120" rx="18"/>
  <text class="label" x="1405" y="332" text-anchor="middle">Ramp / Pitch?</text>
  <text class="small" x="1312" y="362">BNO055 pitch threshold</text>
  <text class="small" x="1312" y="389">speed adapts on slope</text>

  <rect class="box" x="95" y="520" width="230" height="115" rx="16"/>
  <text class="label" x="210" y="554" text-anchor="middle">RPi UART Frame</text>
  <text class="small" x="122" y="584">speed, angle, green_state</text>
  <text class="small" x="122" y="611">silver_line flag</text>

  <rect class="teensy" x="395" y="520" width="250" height="115" rx="16"/>
  <text class="label" x="520" y="554" text-anchor="middle">Teensy Parser</text>
  <text class="small" x="422" y="584">range validation</text>
  <text class="small" x="422" y="611">updates speed and task</text>

  <rect class="teensy" x="720" y="520" width="260" height="115" rx="16"/>
  <text class="label" x="850" y="554" text-anchor="middle">Default Line Action</text>
  <text class="small" x="748" y="584">robot.steer(speed, angle)</text>
  <text class="small" x="748" y="611">speed adjusted by pitch</text>

  <rect class="teensy" x="1055" y="520" width="255" height="115" rx="16"/>
  <text class="label" x="1182" y="554" text-anchor="middle">Special Actions</text>
  <text class="small" x="1082" y="584">green left/right/double</text>
  <text class="small" x="1082" y="611">red stop, obstacle avoidance</text>

  <rect class="teensy" x="1385" y="520" width="230" height="115" rx="16"/>
  <text class="label" x="1500" y="554" text-anchor="middle">Enter Rescue</text>
  <text class="small" x="1412" y="584">send 0xF1 to RPi</text>
  <text class="small" x="1412" y="611">routine = rescue</text>

  <rect class="box" x="545" y="735" width="610" height="92" rx="18"/>
  <text class="label" x="850" y="768" text-anchor="middle">Reliability Layer</text>
  <text class="small" x="575" y="795">RPi drains the serial buffer each loop.</text>
  <text class="small" x="575" y="822">Teensy movement routines include switch-off and timeout guards.</text>

  <path class="arrow" d="M287 154 L350 154"/>
  <path class="arrow" d="M600 154 L665 154"/>
  <path class="arrow" d="M950 154 L1015 154"/>
  <path class="arrow" d="M1315 154 L1390 154"/>
  <path class="arrow" d="M1512 206 C1512 250 200 250 200 298"/>
  <path class="arrow" d="M310 358 L385 358"/>
  <path class="arrow" d="M605 358 L680 358"/>
  <path class="arrow" d="M900 358 L975 358"/>
  <path class="arrow" d="M1205 358 L1280 358"/>
  <path class="arrow" d="M1405 418 C1405 475 210 475 210 520"/>
  <path class="arrow" d="M325 578 L395 578"/>
  <path class="arrow" d="M645 578 L720 578"/>
  <path class="arrow" d="M980 578 L1055 578"/>
  <path class="arrow" d="M1310 578 L1385 578"/>
  <path class="arrow" d="M850 635 L850 735"/>
  <path class="arrow" d="M1500 635 C1500 700 1510 805 1160 805"/>
  <path class="soft" d="M1155 735 C1435 705 1605 650 1515 635"/>

  <text class="tiny" x="326" y="343">green 1/2/3</text>
  <text class="tiny" x="624" y="343">red 10/11</text>
  <text class="tiny" x="916" y="343">silver/APDS</text>
  <text class="tiny" x="1220" y="343">obstacle</text>
  <text class="tiny" x="1520" y="701">state change</text>
</svg>
