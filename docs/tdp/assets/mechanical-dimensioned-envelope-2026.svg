<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111111"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .subtitle { font-family: Arial, sans-serif; font-size: 20px; fill: #333333; }
      .label { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111111; }
      .note { font-family: Arial, sans-serif; font-size: 17px; fill: #333333; }
      .dim { font-family: Arial, sans-serif; font-size: 18px; fill: #111111; }
      .part { fill: #d7ecff; stroke: #1f4e79; stroke-width: 3; rx: 8; }
      .centerline { stroke: #777777; stroke-width: 2; stroke-dasharray: 8 8; }
      .dimline { stroke: #111111; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ext { stroke: #111111; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #dddddd; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <text x="60" y="60" class="title">Final CAD envelope - dimensioned reference</text>
  <text x="60" y="92" class="subtitle">Fusion 360 overall dimensions used for inspection, transport and rebuild checks</text>

  <rect x="60" y="125" width="330" height="430" class="panel"/>
  <rect x="435" y="125" width="330" height="430" class="panel"/>
  <rect x="810" y="125" width="330" height="430" class="panel"/>

  <!-- Top view: length x width -->
  <text x="200" y="165" text-anchor="middle" class="label">Top view</text>
  <rect x="118" y="230" width="235" height="265" class="part"/>
  <line x1="235.5" y1="230" x2="235.5" y2="495" class="centerline"/>
  <line x1="118" y1="362.5" x2="353" y2="362.5" class="centerline"/>
  <line x1="118" y1="515" x2="353" y2="515" class="dimline"/>
  <line x1="118" y1="500" x2="118" y2="530" class="ext"/>
  <line x1="353" y1="500" x2="353" y2="530" class="ext"/>
