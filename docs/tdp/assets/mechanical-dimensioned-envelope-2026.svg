  <line x1="92" y1="230" x2="92" y2="495" class="dimline"/>
  <line x1="105" y1="230" x2="78" y2="230" class="ext"/>
  <line x1="105" y1="495" x2="78" y2="495" class="ext"/>
  <text x="72" y="362.5" text-anchor="middle" transform="rotate(-90 72 362.5)" class="dim">Width 176.913 mm</text>

  <!-- Front view: width x height -->
  <text x="600" y="165" text-anchor="middle" class="label">Front view</text>
  <rect x="487" y="230" width="265" height="265" class="part"/>
  <rect x="515" y="445" width="55" height="50" fill="#a8d8ff" stroke="#1f4e79" stroke-width="2"/>
  <rect x="665" y="445" width="55" height="50" fill="#a8d8ff" stroke="#1f4e79" stroke-width="2"/>
  <line x1="619.5" y1="230" x2="619.5" y2="495" class="centerline"/>
  <line x1="487" y1="515" x2="752" y2="515" class="dimline"/>
  <line x1="487" y1="500" x2="487" y2="530" class="ext"/>
  <line x1="752" y1="500" x2="752" y2="530" class="ext"/>
  <text x="619.5" y="545" text-anchor="middle" class="dim">Width 176.913 mm</text>
  <line x1="462" y1="230" x2="462" y2="495" class="dimline"/>
  <line x1="475" y1="230" x2="448" y2="230" class="ext"/>
  <line x1="475" y1="495" x2="448" y2="495" class="ext"/>
  <text x="442" y="362.5" text-anchor="middle" transform="rotate(-90 442 362.5)" class="dim">Height 176.239 mm</text>

  <!-- Side view: length x height -->
  <text x="975" y="165" text-anchor="middle" class="label">Side view</text>
  <rect x="873" y="230" width="235" height="265" class="part"/>
  <path d="M900 300 L1080 300 L1080 390 L900 390 Z" fill="#eef7ff" stroke="#1f4e79" stroke-width="2"/>
  <circle cx="925" cy="475" r="22" fill="#9bc9ee" stroke="#1f4e79" stroke-width="2"/>
  <circle cx="1060" cy="475" r="22" fill="#9bc9ee" stroke="#1f4e79" stroke-width="2"/>
  <line x1="873" y1="515" x2="1108" y2="515" class="dimline"/>
  <line x1="873" y1="500" x2="873" y2="530" class="ext"/>
  <line x1="1108" y1="500" x2="1108" y2="530" class="ext"/>
  <text x="990.5" y="545" text-anchor="middle" class="dim">Length 157.189 mm</text>
  <line x1="847" y1="230" x2="847" y2="495" class="dimline"/>
  <line x1="860" y1="230" x2="833" y2="230" class="ext"/>
  <line x1="860" y1="495" x2="833" y2="495" class="ext"/>
  <text x="827" y="362.5" text-anchor="middle" transform="rotate(-90 827 362.5)" class="dim">Height 176.239 mm</text>

  <rect x="60" y="590" width="1080" height="55" fill="#f7f7f7" stroke="#cccccc" stroke-width="2" rx="10"/>
  <text x="85" y="625" class="note">Measured mass: 1404 g. Overall CAD envelope: 157.189 mm L x 176.913 mm W x 176.239 mm H. Source: Fusion 360 final assembly + physical scale.</text>
</svg>
