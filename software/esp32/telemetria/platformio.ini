; ============================================================================
;  RescueBot — Telemetria ESP32-MINI (AP WiFi + GUI)
;  IITA Salta · RoboCup Junior Rescue Line 2026
;
;  Recibe la telemetria del Teensy por UART (Serial8 -> UART1 de la ESP32),
;  monta un Access Point WiFi y sirve una GUI web con TODOS los valores.
;  Sin librerias externas: usa solo WiFi + WebServer del core Arduino-ESP32.
;
;  BOARD: por defecto ESP32-C3 Super Mini (la "C3" del ex-SuperTema).
;  Si tu modulo es otro (S2 Mini, WROOM MiniKit, C6...), cambia 'board' abajo;
;  el codigo es agnostico salvo los pines UART (ver src/main.cpp).
; ============================================================================
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; USB-CDC para ver los logs por el puerto USB del modulo (debug opcional).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- Alternativas (descomentar la que corresponda a tu modulo) ----
; [env:esp32-s2-mini]
; platform = espressif32
; board = lolin_s2_mini
; framework = arduino
; monitor_speed = 115200
;
; [env:esp32-wroom-minikit]
