[platformio]
; SIN esto, un `pio run --target upload` sin -e flashea LOS TRES entornos en
; orden y el robot queda con el ultimo (diagnostico_fix). El de competencia
; tiene que ser el que sale por defecto.
default_envs = teensy_hid_device

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http
;https://docs.platformio.org/page/projectconf.html

[env:teensy_hid_device]
platform = teensy
board = teensy41
framework = arduino
; Inyecta el sha del commit como -DTLM_COMMIT="...", para que cada corrida
; grabada sepa con que firmware se hizo. Si git no esta, define "nogit" y el
; build sigue igual. Ver git_commit.py.
extra_scripts = pre:git_commit.py
lib_deps =
	adafruit/Adafruit BNO055@^1.6.3
	SPI
	adafruit/Adafruit APDS9960 Library@^1.3.0
	d03n3rfr1tz3/HC-SR04@^1.1.2
	ericksimoes/Ultrasonic@^3.0.0

; ============================================================================
;  ENTORNO `diagnostico` - MISMO codigo fuente, binario aparte.
;
;  Compila src/main.cpp exactamente igual que el de competencia pero con
;  MODO_DIAGNOSTICO=1, que enciende el registrador CSV de alta frecuencia
;  (200 Hz) de la reaccion de los motores, y apaga la telemetria JSON de 10 Hz
;  para que no compita por CPU ni por el puerto.
;
;  NO es una copia de main.cpp a proposito: una copia diverge y entonces el
;  diagnostico deja de describir al robot que compite. Es el mismo archivo.
;
;  Uso:
;    pio run -e diagnostico --target upload
;    python tools/registrar_diagnostico.py COM7 curva1.csv
;
;  Para correr SUELTO en la pista (sin cable USB), agregar -D DIAG_PUERTO=1 y
;  colgar un adaptador USB-TTL del TX de Serial8 (pin 35). En ese modo la ESP32
;  de telemetria no se usa: espera JSON y esto es CSV.
; ============================================================================
[env:diagnostico]
extends = env:teensy_hid_device
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=0

; ============================================================================
[env:diagnostico_fix]
extends = env:teensy_hid_device
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=0
	-D FIX_LAZO_MOTOR=1
	-D FIX_CURVA_CONTINUA=1

; ============================================================================
;  ENTORNO `diagnostico_lazo` - SOLO el fix del lazo de motor.
;
;  Existe porque `diagnostico_fix` enciende DOS cosas a la vez y entonces
;  cualquier diferencia contra `diagnostico` tiene dos explicaciones posibles y
;  ninguna forma de separarlas. Con este, el sabado son TRES corridas de la
;  misma curva y cada diferencia queda atribuida:
;     diagnostico       -> como esta hoy
;     diagnostico_lazo  -> + fix del lazo (feedforward, piso, sin toggle)
;     diagnostico_fix   -> + fix del lazo + rotation continua
; ============================================================================
[env:diagnostico_lazo]
extends = env:teensy_hid_device
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=0
	-D FIX_LAZO_MOTOR=1

; ============================================================================
;  ENTORNO `diagnostico_suelto` - registro por Serial8 en vez de por USB.
;
;  POR QUE: con DIAG_PUERTO=0 el CSV sale por el USB, o sea que el robot corre
;  ATADO a un cable de 3 m. En una curva cerrada ese cable tira del chasis, que
;  es justo la mecanica que se esta midiendo. Y si nadie esta leyendo el puerto,
;  availableForWrite() queda en 0, el anillo se llena y NO SE GRABA NADA con el
;  robot corriendo normal: el fallo es silencioso (por eso ahora hay latido de LED).
;
;  COMO: adaptador USB-TTL colgado del TX de Serial8 (pin 35) a 921600 baud.
;  En este modo la ESP32 de telemetria no se usa (espera JSON y esto es CSV).
;  PROBARLO EL VIERNES de punta a punta: es un camino que nunca corrio.
;  Si el enlace no da abasto (drop > 0), bajar DIAG_HZ a 150 o a 100.
; ============================================================================
[env:diagnostico_suelto]
extends = env:teensy_hid_device
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=0
	-D DIAG_PUERTO=1

; ============================================================================
;  ENTORNO `banco_barrido` - EL PRIMER BINARIO A SUBIR SI HAY UN SOLO DIA.
;
;  Barrido automatico de actuacion: sin pista, sin vision, sin la Raspberry.
;  El robot pivotea en el lugar (todo el barrido entra en 25 cm de diametro),
;  asi que alcanza con un cable USB corto y la notebook en el piso al lado.
;
;  QUE DECIDE: las dos hipotesis que compiten predicen ORDENES OPUESTOS.
;    - el giro real MEJORA hacia rotation=1  -> PID ciego al signo (firmware)
;    - el giro real EMPEORA hacia rotation=1 -> techo de par (mecanica)
;
;    pio run -e banco_barrido --target upload
;    python tools/registrar_diagnostico.py COM7 banco_piso.csv --nota "piso, ruedas abajo"
;    (prender el switch; dura ~90 s; LED fijo al terminar)
;    python tools/analizar_barrido.py banco_piso.csv
;
;  HACERLO DOS VECES: en el piso y con las ruedas AL AIRE. Si en el aire anda y
;  en el piso no, queda demostrado que el problema depende de la carga.
; ============================================================================
[env:banco_barrido]
extends = env:teensy_hid_device
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=0
	-D MODO_BANCO=1

; ============================================================================
;  ENTORNO `diagnostico_full` - GRABA POR LOS DOS CAMINOS A LA VEZ.
;
;  Para un dia unico de pruebas: si el USB falla (nadie leyendo el puerto, un
;  tiron del cable, el anillo lleno), la corrida NO se pierde porque la ESP32
;  la grabo igual por WiFi.
;    - CSV a 200 Hz por el USB      -> tools/registrar_diagnostico.py
;    - JSON a 10 Hz por Serial8/WiFi -> tools/grabar_wifi.py
;  Usan puertos DISTINTOS, asi que no se pisan. El costo es un snprintf de
;  ~1400 B cada 100 ms, despreciable al lado del registrador de 200 Hz.
;
;  Arrancar el registrador USB ANTES de prender el robot: si nadie lee el
;  puerto, availableForWrite() queda en 0 y el anillo se llena. El LED de la
;  Teensy parpadea cuando esta grabando de verdad.
; ============================================================================
[env:diagnostico_full]
extends = env:teensy_hid_device
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=1
	-D DIAG_PUERTO=0

; ============================================================================
;  ENTORNO `competencia_fix` - EL ROBOT ANDANDO, con los fixes encendidos.
;
;  Es teensy_hid_device (competencia: telemetria normal, sin registrador de
;  200 Hz) pero con los dos fixes activos. Es el binario que se sube cuando el
;  barrido de banco ya confirmo que el problema es de firmware.
;
;  NO se sube antes de medir: si el problema resulta ser mecanico, estos flags
;  cambian el comportamiento sin arreglar nada y encima ensucian la comparacion.
;
;    pio run -e competencia_fix --target upload
;
;  Para volver atras en 30 segundos:  pio run --target upload   (el de siempre)
; ============================================================================
[env:competencia_fix]
extends = env:teensy_hid_device
build_flags =
	-D FIX_LAZO_MOTOR=1
	-D FIX_CURVA_CONTINUA=1

; ============================================================================
;  `banco_barrido_fix` - el mismo barrido de banco pero con los fixes, para
;  medir la mejora contra `banco_barrido` sin cambiar nada mas.
; ============================================================================
[env:banco_barrido_fix]
extends = env:teensy_hid_device
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=0
	-D MODO_BANCO=1
	-D FIX_LAZO_MOTOR=1
	-D FIX_CURVA_CONTINUA=1
