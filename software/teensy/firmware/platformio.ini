; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http
;https://docs.platformio.org/page/projectconf.html

; [IA 2026-08-15] default_envs fija el firmware real como unico env por defecto,
; para que `pio run` / `pio run -t upload` sigan haciendo exactamente lo de antes
; y NO compilen ni suban los envs de prueba agregados abajo.
[platformio]
default_envs = teensy_hid_device

[env:teensy_hid_device]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
	adafruit/Adafruit BNO055@^1.6.3
	SPI
	adafruit/Adafruit APDS9960 Library@^1.3.0
	d03n3rfr1tz3/HC-SR04@^1.1.2
	ericksimoes/Ultrasonic@^3.0.0

; [IA 2026-08-15] Prueba de banco de los 4 motores (lazo abierto, sin PID).
; Compila SOLO test/actuators/test_4_motores.cpp en lugar de src/main.cpp.
;   pio run -e test_motores -t upload
[env:test_motores]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<../test/actuators/test_4_motores.cpp>

; [IA 2026-08-22] Prueba de la libreria DriveBase: marcha adelante a velocidad
; baja y constante, en lazo cerrado con encoders + PID.
; Detecta la polaridad del driver antes de engranar el lazo y aborta si el
; prototipo no es compatible con drivebase.
;   pio run -e test_drivebase -t upload
[env:test_drivebase]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<../test/actuators/test_drivebase_adelante.cpp>
