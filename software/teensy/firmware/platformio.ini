; ============================================================================
;  RescueBot IITA Salta  -  Teensy 4.1  -  RoboCupJunior Rescue Line 2026
;
;  EL BINARIO DE COMPETENCIA SALE POR DEFECTO. Se flashea asi, pelado:
;
;      pio run --target upload
;
;  NO hace falta elegir entorno ni definir PLATFORMIO_BUILD_FLAGS. Hasta el
;  2026-09-06 el procedimiento era:
;      set PLATFORMIO_BUILD_FLAGS=-D LINE_STEER_GAIN=1.0 -D LINE_ROT_EXP=0.85 ^
;        -D LINE_PIVOTE_ENTRA=1.01 -D LINE_RECTA_FACTOR=0.8 ^
;        -D LINE_FRENO_DELANTERO=1 -D LINE_FRENO_STEER=0.70 -D LINE_FRENO_VEL=55
;      pio run -e diagnostico_fix -t upload
;  Esos siete valores ahora son los DEFAULT del panel de configuracion de
;  src/main.cpp (seccion 1), y FIX_LAZO_MOTOR ya vale 1 en lib/drivebase/drivebase.h.
;  El entorno `competencia` de abajo reproduce EXACTAMENTE aquel binario: se
;  verifico funcion por funcion sobre el .elf.
;
;  SI QUERES BARRER UN VALOR sin editar el fuente, la variable de entorno sigue
;  funcionando (todo el panel esta detras de #ifndef). En PowerShell:
;      $env:PLATFORMIO_BUILD_FLAGS = "-D LINE_ROT_EXP=0.70"
;      pio run --target upload
;      Remove-Item Env:PLATFORMIO_BUILD_FLAGS     <-- ESTA LINEA NO SE OLVIDA:
;  en PowerShell la variable queda pegada a esa consola y contamina todo build
;  posterior, sin avisar.
; ============================================================================

[platformio]
; Sin esto, un `pio run --target upload` sin -e flashea TODOS los entornos en
; orden y el robot queda con el ultimo. El de competencia tiene que ser el que
; sale por defecto.
default_envs = competencia


; ============================================================================
;  `base` - placa, framework y librerias. NO SE FLASHEA DIRECTO: es de lo que
;  heredan los demas entornos.
; ============================================================================
[env:base]
platform = teensy
board = teensy41
framework = arduino
; Inyecta el sha del commit como -DTLM_COMMIT="...", para que cada corrida
; grabada sepa con que firmware se hizo. Si git no esta, define "nogit" y el
; build sigue igual. Ver git_commit.py.
extra_scripts = pre:git_commit.py
lib_deps =
	; Adafruit BNO055 NO va aca: se usa la copia acotada de lib/, porque el
	; begin() original espera PARA SIEMPRE a que el sensor vuelva del reset y
	; cuelga el setup() sin decir nada. Ver lib/Adafruit_BNO055_acotado/.
	; Estas dos venian como dependencias transitivas suyas y ahora van explicitas.
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit BusIO@^1.17.4
	SPI
	adafruit/Adafruit APDS9960 Library@^1.3.0
	d03n3rfr1tz3/HC-SR04@^1.1.2
	ericksimoes/Ultrasonic@^3.0.0


; ============================================================================
;  `competencia` - EL ROBOT. Es el que se sube a la pista.
;
;  >>> POR QUE LLEVA MODO_DIAGNOSTICO=1 Y TELEMETRIA=0, Y POR QUE NO SE TOCA <<<
;
;  Porque ES EL BINARIO QUE SE TUNEO EN PISTA. Hasta el 2026-09-06 esto se
;  flasheaba como `-e diagnostico_fix`, que define exactamente estas dos cosas.
;  Toda la configuracion de movimiento que hoy funciona -la que toma los codos-
;  se ajusto corriendo CON esta carga de CPU encima.
;
;  Y LA CARGA NO ES DESPRECIABLE. Con MODO_DIAGNOSTICO=1, DIAG_TICK() corre en
;  cada vuelta del lazo de linea y adentro tiene:
;     diagRefrescarImu()  una lectura I2C del BNO055 a 50 Hz -> ~2 ms cada 20 ms,
;                         o sea alrededor del 10 % del lazo
;     diagDrenar()        formatea hasta 200 lineas CSV por segundo
;  Con TELEMETRIA=0, en cambio, NO corre el snprintf de 1664 bytes ni las dos
;  lecturas del BNO cada 100 ms de la telemetria (~2 %).
;
;  O sea que apagar el registrador y prender la telemetria NO es neutro: cambia
;  el periodo del lazo, y con el, cada cuanto reacciona el robot a la camara.
;  Si algun dia se cambia, se cambia y SE VUELVE A PROBAR EN PISTA.
;
;  CONSECUENCIA PRACTICA: la telemetria a la ESP32 NO FUNCIONA con este binario.
;  Nunca funciono con el que se flashea. Para eso esta el entorno `telemetria`.
;
;  Correr sin cable USB es seguro: si nadie lee el puerto, availableForWrite()
;  queda en 0, diagDrenar() no escribe -es no bloqueante por diseno-, el anillo
;  se llena y el LED de la placa parpadea rapido. El control no se entera.
; ============================================================================
[env:competencia]
extends = env:base
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=0


; ============================================================================
;  `telemetria` - MISMO codigo, pero con la GUI de la ESP32 en vez del CSV.
;
;  Registrador de 200 Hz APAGADO, telemetria JSON a 10 Hz por Serial8 PRENDIDA.
;  Sirve para mirar el robot en vivo desde el celular (AP WiFi de la ESP32-MINI,
;  ver software/esp32/telemetria/) y para calibrar el sensor de color en idle.
;
;  OJO: NO es el binario tuneado. Tiene MENOS carga de CPU en el lazo que
;  `competencia` (~2 % contra ~10 %), asi que el lazo corre mas rapido y el
;  robot reacciona a la camara mas seguido. Puede andar mejor o peor: no esta
;  medido. NO usarlo en una corrida que cuente sin probarlo antes.
; ============================================================================
[env:telemetria]
extends = env:base

; ============================================================================
;  `competencia_tlm` - DEBUG TEMPORAL.
;
;  Mantiene el diagnostico del firmware de competencia para que rampa.h siga
;  recibiendo la IMU, y ADEMAS habilita la telemetria hacia la ESP32.
;
;  SOLO PARA PRUEBAS: agrega carga de CPU respecto del binario de competencia.
; ============================================================================
[env:competencia_tlm]
extends = env:base
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=1
; ============================================================================
;  `diagnostico_suelto` - el registro CSV por Serial8 en vez de por USB.
;
;  POR QUE: con el CSV saliendo por el USB el robot corre ATADO a un cable de
;  3 m, y en una curva cerrada ese cable tira del chasis, que es justo la
;  mecanica que se esta midiendo.
;
;  COMO: adaptador USB-TTL colgado del TX de Serial8 (pin 35) a 921600 baud.
;  En este modo la ESP32 de telemetria no se usa: espera JSON y esto es CSV.
;  Si el enlace no da abasto (drop > 0), bajar DIAG_HZ a 150 o a 100.
;
;    pio run -e diagnostico_suelto --target upload
;    python tools/registrar_diagnostico.py COM7 curva1.csv
;    python tools/analizar_diagnostico.py curva1.csv
; ============================================================================
[env:diagnostico_suelto]
extends = env:base
build_flags =
	-D MODO_DIAGNOSTICO=1
	-D TELEMETRIA=0
	-D DIAG_PUERTO=1


; ============================================================================
;  BANCOS DE HARDWARE - NO son el robot. Son tres sketches sueltos de
;  banco/*.cpp que reemplazan a main.cpp por completo (build_src_filter), para
;  aislar un problema de hardware sin la maquinaria del firmware encima.
;
;  Despues de usarlos, volver al firmware:  pio run --target upload
; ============================================================================

; `banco_pines` - tester de los pines de encoder. Se sube cuando el registrador
; dice que `raw` no se mueve, para separar "no llega senial" de "cable al aire"
; de "problema de firmware". No usa ninguna libreria del robot ni toca motores.
;   (girar las ruedas con el dedo mientras se lee el puerto)
[env:banco_pines]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<../banco/pines.cpp>

; `banco_girar` - comanda UNA rueda por vez y cuenta flancos en su encoder.
; Existe porque girar la rueda con el dedo NO prueba que el encoder ande: el
; FIT0441 puede no emitir FG cuando se lo back-drivea.
; MUEVE MOTORES: el robot tiene que estar EN EL AIRE. 10 s de cuenta regresiva.
[env:banco_girar]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<../banco/girar.cpp>

; `banco_i2c` - por que no arranca el firmware. Imprime paso a paso y hace
; parpadear el LED todo el tiempo: si el LED se detiene, el ultimo paso impreso
; es el que colgo. Incluye recuperacion de bus (9 pulsos de reloj).
[env:banco_i2c]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<../banco/i2c.cpp>
