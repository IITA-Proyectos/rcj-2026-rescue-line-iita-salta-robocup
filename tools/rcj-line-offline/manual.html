<div class="container-fluid mt-4"><!-- Checkpoints Section-->
<div class="card-entry"><div class="card-entry-header"><h4><i class="fas fa-clipboard-check"></i>Checkpoints &amp; Scored Elements</h4></div><div class="scroll-area"><div class="checkpoint-column-wrap"><!-- Standard Elements from elementList-->
<div ng-repeat="list in elementList" style="display: contents;"><div class="entry-item-compact" ng-repeat="item in list" ng-class="{'active': itemSuccess(item), 'has-lop': item.LoP != null &amp;&amp; !item.afterLoP, 'is-checkpoint': isCheckPoint(item) || item.start}"><div class="item-id" ng-if="!item.afterLoP">{{item.index + 1}}</div><div class="item-id" ng-if="item.afterLoP"><i class="fas fa-flag-checkered"></i></div><div class="item-img-wrapper" ng-if="!item.afterLoP"><img ng-src="{{getTileImage(item)}}" ng-if="getTileImage(item)" style="width: 100%; height: 100%; object-fit: contain;"></div><!-- Always show status icon for tiles--><div class="status-icon" ng-if="!item.afterLoP"><i class="fas fa-check-circle" ng-if="itemSuccess(item)"></i><i class="far fa-circle" ng-if="!itemSuccess(item)"></i></div><div class="lop-input-wrapper" ng-if="item.LoP != null" ng-style="!item.afterLoP ? {'grid-row': '2', 'grid-column': '1 / span 4', 'display': 'flex', 'align-items': 'center', 'justify-content': 'space-between', 'border-top': '1px dashed var(--border)', 'padding-top': '6px'} : {'grid-column': '2 / span 3', 'display': 'flex', 'align-items': 'center', 'gap': '8px'}"><div class="lop-icon" style="color: var(--primary); font-size: 0.9rem;"><i class="fas fa-undo me-2"></i><span class="small fw-bold">LoPs</span></div><div class="lop-display-badge"><span>{{LoPs[item.LoP]}}</span></div></div></div></div></div></div></div><!-- Victims Section-->
<div class="card-entry"><div class="card-entry-header"><h4><i class="fas fa-user-injured">Victims</i></h4></div><div class="p-4"><div class="score-sheet-grid"><div class="grid-header-row"><div class="grid-label">Zone</div><div class="grid-sequence" ng-repeat="n in range(3)">{{n + 1}}</div></div><div class="grid-data-row zone-green"><div class="grid-zone-label"><img src="images/evacZone/green_lv2.png"><span>GREEN</span></div><div class="grid-cell" ng-repeat="n in range(3)"><div class="cell-victim" ng-if="getVictimAt(n, 'GREEN')"><img src="images/liveVictim.png" ng-if="getVictimAt(n, 'GREEN').victimType == 'LIVE'"><img src="images/deadVictim.png" ng-if="getVictimAt(n, 'GREEN').victimType == 'DEAD'"><div class="victim-type-label">{{getVictimAt(n, 'GREEN').victimType == 'LIVE' ? 'L' : 'D'}}</div></div></div></div><div class="grid-data-row zone-red"><div class="grid-zone-label"><img src="images/evacZone/red_lv2.png"><span>RED</span></div><div class="grid-cell" ng-repeat="n in range(3)"><div class="cell-victim" ng-if="getVictimAt(n, 'RED')"><img src="images/liveVictim.png" ng-if="getVictimAt(n, 'RED').victimType == 'LIVE'"><img src="images/deadVictim.png" ng-if="getVictimAt(n, 'RED').victimType == 'DEAD'"><div class="victim-type-label">{{getVictimAt(n, 'RED').victimType == 'LIVE' ? 'L' : 'D'}}</div></div></div></div></div></div></div><!-- Others & Time Section-->
<div class="row"><div class="col-md-6"><div class="card-entry h-100"><div class="card-entry-header"><h4><i class="fas fa-award">Final Bonus</i></h4></div><div class="p-4 text-center"><div class="bonus-visual" ng-style="{'background-color': exitBonus?'#f0fdf4':'#fef2f2', 'border-color': exitBonus?'#10b981':'#ef4444'}" style="border: 2px solid; padding: 20px; border-radius: 16px; transition: all 0.3s; display: flex; align-items: center; gap: 24px; justify-content: center;"><img src="images/line_bonus.png" style="height: 50px; object-fit: contain;"><div class="fw-bold" ng-style="{'color': exitBonus?'#10b981':'#ef4444'}" style="font-size: 1.2rem;"><i class="fas me-2" ng-class="exitBonus?'fa-check-circle':'fa-times-circle'"></i>{{exitBonus?'Achieved':'No Bonus'}}</div></div></div></div></div><div class="col-md-6"><div class="card-entry h-100"><div class="card-entry-header"><h4><i class="fas fa-clock">Time</i></h4></div><div class="p-4 d-flex flex-column align-items-center justify-content-center"><div class="static-label">Recorded Time</div><div class="static-value">{{minutes | numberFixedLen:2}} : {{seconds | numberFixedLen:2}}</div></div></div></div></div><!-- Final Calculation Large-->
<div class="calc-summary mb-5"><div class="static-label">Final Score Calculation</div><div class="calc-row"><div class="calc-item"><div class="calc-val">{{raw_score}}</div><div class="small text-muted">points</div></div><div class="calc-op">&times;</div><div class="calc-item"><div class="calc-val">{{multiplier}}</div><div class="small text-muted">multiplier</div></div><div class="calc-op">=</div><div class="calc-item"><div class="calc-result">{{score}}</div><div class="small text-muted">final pts</div></div></div></div></div>
<div class="footer-action"><button class="btn-premium btn-reject" type="button" ng-click="cancel()"><i class="fas fa-times"></i>Reject</button><button class="btn-premium btn-approve" type="button" ng-click="approval()"><i class="fas fa-check-double"></i>Approve &amp; Submit Score</button></div>
</template>
<script>
  // [local] se inserta el cuerpo de la variante elegida antes del arranque de Angular (DOMContentLoaded) y se quitan las plantillas
  (function () {
    var s = document.currentScript;
    var input = document.getElementById('rcj-cuerpo-input');
    var check = document.getElementById('rcj-cuerpo-check');
    var elegida = RCJLocal.param('check') === 'true' ? check : input;
    s.parentNode.insertBefore(document.importNode(elegida.content, true), input);
    input.parentNode.removeChild(input);
    check.parentNode.removeChild(check);
    s.parentNode.removeChild(s);
  })();
</script>
</body>
</html>
