<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Salidas — capturas de planillas.html</title>
<!--
  Usada por tests/salidas-correr.py con --screenshot y el mismo perfil de Edge que salidas-sembrar.html
  (los datos quedan en su IndexedDB). Muestra planillas.html en n iframes de ancho×alto apilados (cada uno
  desplazado más abajo) y mide en el primero: scroll horizontal de la página, controles fuera de la pantalla
  o recortados (inalcanzables) y controles chicos para el dedo (< 40 px).
  Parámetros: competition=<id> ancho alto n nombre
-->
<script src="salidas-comun.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  iframe { margin: 0 0 4px 0 !important; background: #fff; }
  #resultado { display: none; }
</style>
</head>
<body>
<pre id="resultado">PENDIENTE</pre>
<div id="marcos"></div>
<script>
T.alTerminar = function (res) {
  var nombre = new URLSearchParams(location.search).get('nombre');
  if (!nombre) return null;
  return fetch('/__resultado?nombre=' + encodeURIComponent(nombre), { method: 'POST', body: JSON.stringify(res) });
};

function describir(el) {
  var s = el.tagName.toLowerCase();
  if (el.id) s += '#' + el.id;
  var c = (typeof el.className === 'string' ? el.className : '').trim().split(/\s+/).filter(Boolean).slice(0, 2);
  if (c.length) s += '.' + c.join('.');
  var t = (el.textContent || el.getAttribute('for') || '').trim().replace(/\s+/g, ' ').slice(0, 30);
  return s + (t ? ' «' + t + '»' : '');
}

T.correr(async function () {
  var q = new URLSearchParams(location.search);
  var ancho = Number(q.get('ancho') || 1024), alto = Number(q.get('alto') || 768);
  var n = Math.max(1, Math.min(8, Number(q.get('n') || 1)));
  var url = '../planillas.html?competition=' + encodeURIComponent(q.get('competition') || '') + '&league=Line';
  var contenedor = document.getElementById('marcos');
  var marcos = [];
  for (var k = 0; k < n; k++) marcos.push(await T.cargarIframe(url, ancho, alto, contenedor));
  for (var j = 0; j < n; j++) {
    await T.esperarHttp(marcos[j]);
    await T.esperarQue(function () { return !marcos[j].contentDocument.querySelector('.loader'); }, 20000, 'loader removido');
  }
  await T.esperar(800);

  var w = marcos[0].contentWindow, d = marcos[0].contentDocument;
  var info = { ancho: ancho, alto: alto, n: n, innerWidth: w.innerWidth, scrollWidth: d.documentElement.scrollWidth, altoPagina: d.documentElement.scrollHeight };
  T.igual('2 corridas en la tabla', d.querySelectorAll('table.custom tbody tr[ng-repeat^="run in runs"]').length, 2);
  T.check('sin scroll horizontal de la página', d.documentElement.scrollWidth <= w.innerWidth + 1, { scrollWidth: d.documentElement.scrollWidth, innerWidth: w.innerWidth });

  var inalcanzables = [], chicos = [], fuera = [];
  d.querySelectorAll('a[href], button, input:not([type=hidden]), select, textarea, label.checkbox, [ng-click]').forEach(function (el) {
    var r = el.getBoundingClientRect();
    if (r.width <= 1 || r.height <= 1) return;
    if (w.getComputedStyle(el).visibility === 'hidden') return;
    var problema = null;
    if (r.right > w.innerWidth + 1 || r.left < -1) problema = 'fuera de la pantalla';
    for (var p = el.parentElement; p && p !== d.body; p = p.parentElement) {
      var ox = w.getComputedStyle(p).overflowX;
      if (ox === 'visible') continue;
      var pr = p.getBoundingClientRect();
      if (ox === 'auto' || ox === 'scroll') {
        if (problema && pr.right <= w.innerWidth + 1 && pr.left >= -1) problema = null;
        break;
      }
      if (ox === 'hidden' || ox === 'clip') {
        if (r.right > pr.right + 1 || r.left < pr.left - 1) { problema = 'recortado por ' + describir(p); break; }
      }
    }
    if (problema) inalcanzables.push(describir(el) + ' [' + Math.round(r.left) + '..' + Math.round(r.right) + '] ' + problema);
    else if (Math.min(r.width, r.height) < 40) chicos.push(describir(el) + ' ' + Math.round(r.width) + '×' + Math.round(r.height));
  });
  d.querySelectorAll('body *').forEach(function (el) {
    var r = el.getBoundingClientRect();
    if (r.width > 1 && r.height > 1 && r.right > w.innerWidth + 1) fuera.push(describir(el) + ' right=' + Math.round(r.right));
  });
  info.inalcanzables = inalcanzables.slice(0, 40);
  info.controlesChicos = chicos.length;
  info.ejemplosChicos = chicos.slice(0, 25);
  info.elementosMasAnchos = fuera.slice(0, 15);
  T.check('ningún control inalcanzable o recortado', inalcanzables.length === 0, inalcanzables.slice(0, 40));
  // En tablet y celular (≤ 1024 px) botones, campos y checkboxes tienen que medir ≥ 40 px
  if (ancho <= 1024) T.check('controles tocables (≥ 40 px) en tablet/celular', chicos.length === 0, chicos.slice(0, 25));

  // Peor caso: todas las columnas de la lista encendidas (en el scope del controlador) => sin scroll de página
  var alcance = w.angular.element(d.body).scope();
  var columnas = ['showTeam', 'showCode', 'showField', 'showOriginalScore', 'showAdjustment', 'showScore', 'showNormalizedScore', 'showTime', 'showLoPs', 'showVictim', 'showMultiplier', 'showExit'];
  var antes = {};
  alcance.$apply(function () { columnas.forEach(function (c) { antes[c] = alcance[c]; alcance[c] = true; }); });
  await T.esperar(500);
  var tabla = d.querySelector('table.custom');
  info.todasLasColumnas = { scrollWidth: d.documentElement.scrollWidth, anchoTabla: Math.round(tabla.getBoundingClientRect().width), scrollTabla: tabla.scrollWidth };
  T.check('todas las columnas: la página no se desplaza a lo ancho (la tabla sí, si hace falta)', d.documentElement.scrollWidth <= w.innerWidth + 1, info.todasLasColumnas);
  alcance.$apply(function () { columnas.forEach(function (c) { alcance[c] = antes[c]; }); });
  await T.esperar(300);

  for (var m = 1; m < n; m++) marcos[m].contentWindow.scrollTo(0, m * (alto - 80));
  await T.esperar(400);
  return info;
});
</script>
</body>
</html>
