<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juez — celular 412x915: nada tapado, sin scroll horizontal, controles tocables</title>
<script src="juez-comun.js"></script>
<script src="../local/config.js"></script>
<script src="../local/nucleo/store.js"></script>
<script src="../local/nucleo/pathfinder-servidor.js"></script>
<script src="../local/nucleo/init-run.js"></script>
<script src="../local/nucleo/score-2026.js"></script>
<script src="../local/nucleo/copy-properties.js"></script>
<script src="../local/nucleo/api.js"></script>
<script src="../local/nucleo/ranking.js"></script>
<script src="../local/io-shim.js"></script>
</head>
<body>
<pre id="resultado">PENDIENTE</pre>
<script>
/*
 * El juez corre en un iframe de 412x915 (tamaño CSS de un Android típico): las media queries del juez
 * ven 412 px. Se mide el layout real con getBoundingClientRect y se juega una corrida corta con clics.
 */
T.correr(async function () {
  var J = T.juez;
  var s = await T.sembrar(await T.fixture('fixture-mapa-oficial.json'));
  var runId = s.runId;
  T.extra.runId = runId;
  J.crear(412, 915);
  await J.abrir('../juez.html?run=' + runId);
  var w = J.win(), d = J.doc(), sc = J.scope();
  var navAbajo = function () { return d.querySelector('nav').getBoundingClientRect().bottom; };
  var desplazador = function () { return d.scrollingElement || d.body; };

  function medir(nombre) {
    var desbordan = J.$$('body *').filter(function (e) {
      var r = e.getBoundingClientRect();
      return r.width > 0 && (r.right > w.innerWidth + 1 || r.left < -1);
    }).slice(0, 10).map(function (e) { return e.tagName + '.' + String(e.className).slice(0, 40) + ' [' + Math.round(e.getBoundingClientRect().left) + ',' + Math.round(e.getBoundingClientRect().right) + ']'; });
    T.check(nombre + ': sin desborde horizontal (ancho 412)', w.innerWidth === 412 && desplazador().scrollWidth <= w.innerWidth && desbordan.length === 0, { innerWidth: w.innerWidth, scrollWidth: desplazador().scrollWidth, desbordan: desbordan });
    var chicos = J.$$('button').filter(function (b) {
      var r = b.getBoundingClientRect();
      return r.width > 0 && (r.width < 36 || r.height < 30);
    }).map(function (b) { return b.outerHTML.slice(0, 90) + ' ' + Math.round(b.getBoundingClientRect().width) + 'x' + Math.round(b.getBoundingClientRect().height); });
    T.check(nombre + ': botones visibles de al menos 36x30 px', chicos.length === 0, chicos);
  }

  T.check('movil-juez.css cargada', Array.prototype.some.call(d.styleSheets, function (h) { return (h.href || '').indexOf('local/ui/movil-juez.css') >= 0; }));
  T.check('navbar en 2 filas en celular (alto > 70 px)', d.querySelector('nav').getBoundingClientRect().height > 70, d.querySelector('nav').getBoundingClientRect().height);

  // ---------------------------------------------------------------- pre-chequeo
  w.scrollTo(0, 0);
  await T.esperar(100);
  var titulo = J.$('h4');
  T.check('pre-chequeo: el título no queda debajo de la navbar', titulo.getBoundingClientRect().top >= navAbajo(), [titulo.getBoundingClientRect().top, navAbajo()]);
  medir('pre-chequeo');
  await T.esperarQue(function () { return sc.checkMember && sc.checkMachine; }, 5000, 'fotos premarcadas');
  J.click(J.$('tr[ng-click="toggleCheckTeam()"]'));
  J.click(J.$('tr[ng-click="toggleCheckRound()"]'));
  await T.esperar(80);
  var confirmar = J.$('button[ng-click="infochecked()"]');
  confirmar.scrollIntoView({ block: 'end' });
  await T.esperar(100);
  var rc = confirmar.getBoundingClientRect();
  // +1 px: scrollIntoView({block:'end'}) deja el borde en coordenadas fraccionarias (p. ej. 915.375 con alto 915)
  T.check('pre-chequeo: "I confirmed!!" alcanzable y habilitado', !confirmar.disabled && rc.top >= navAbajo() && rc.bottom <= w.innerHeight + 1 && rc.right <= w.innerWidth, [rc.top, rc.bottom, rc.right]);
  J.click(confirmar);
  await T.esperar(2400); // tile_size corre a los 200 y 2000 ms

  // ---------------------------------------------------------------- puntuación
  w.scrollTo(0, 0);
  await T.esperar(100);
  var timer = J.$$('button[ng-click="toggleTime()"]')[0];
  T.check('puntuación: botón Start debajo de la navbar', timer.getBoundingClientRect().top >= navAbajo(), [timer.getBoundingClientRect().top, navAbajo()]);
  var area = d.getElementById('card_area');
  T.check('puntuación: #card_area sin scroll anidado', w.getComputedStyle(area).overflowY === 'visible' && area.scrollHeight <= area.clientHeight + 1, { overflow: w.getComputedStyle(area).overflowY, sh: area.scrollHeight, ch: area.clientHeight });
  var grilla = d.getElementById('wrapTile').getBoundingClientRect();
  var slot = J.$('.slot').getBoundingClientRect();
  T.check('puntuación: grilla dentro del ancho y baldosas de al menos 40 px', grilla.right <= w.innerWidth && slot.width >= 40, { derecha: grilla.right, slot: slot.width });
  T.extra.baldosaPx = Math.round(slot.width);
  medir('puntuación');

  // corrida corta con clics
  var n0 = J.pedidos.length;
  J.click(timer);
  await J.esperarPedidos(n0, 1);
  await T.esperar(1200);
  n0 = J.pedidos.length;
  J.click(J.baldosa(0, 0));
  J.click(J.baldosa(1, 0));
  await J.esperarPedidos(n0, 2);
  var mas = J.$$('div[ng-repeat="cp in range(LoPs.length) track by $index"]')[0].querySelector('button.btn-success');
  n0 = J.pedidos.length;
  J.click(mas);
  var ult = (await J.esperarPedidos(n0, 1)).pop();
  T.check('corrida corta: inicio + lomo + LoP, navbar == backend', ult.status === 200 && J.puntajeNavbar() === ult.data.score && sc.showedUp === true, { navbar: J.puntajeNavbar(), data: ult.data });
  n0 = J.pedidos.length;
  J.click(timer);
  await J.esperarPedidos(n0, 1);

  w.scrollTo(0, desplazador().scrollHeight);
  await T.esperar(150);
  var go = J.$('button[ng-click="confirm()"]');
  var rg = go.getBoundingClientRect();
  T.check('Go NEXT alcanzable al final de la página y habilitado', !go.disabled && rg.top >= navAbajo() && rg.bottom <= w.innerHeight && rg.right <= w.innerWidth, [rg.top, rg.bottom, rg.right, go.disabled]);
  var inputs = J.$$('input[ng-model="minutes"], input[ng-model="seconds"]').map(function (i) { return i.getBoundingClientRect(); });
  T.check('inputs de minutos/segundos visibles y dentro del ancho', inputs.length === 2 && inputs.every(function (r) { return r.width >= 40 && r.right <= w.innerWidth; }), inputs.map(function (r) { return [r.width, r.right]; }));
  medir('fila inferior');
});
</script>
</body>
</html>
