<body>
<pre id="resultado">PENDIENTE</pre>
<script>
T.correr(async function () {
  var s = await T.sembrar();
  var lista = await T.api('GET', '/api/runs/line/competition/' + s.cid + '?normalized=true');
  T.igual('E12 devuelve las 2 corridas', lista.data.length, 2);
  T.check('las 2 corridas quedaron puntuadas', s.puntajes.every(function (p) { return p.msg === 'Saved run'; }), s.puntajes);
  return { cid: s.cid, mapId: s.mapId, runs: s.runs, puntajes: s.puntajes };
});
</script>
</body>
