<script>
  // [rcj-line-offline] script inline de view_iframe/line_2026.pug:10-34, solo en la variante iframe.
  // La última declaración global de tile_size() gana sobre la de sign/line_2026.js.
  if (rcjVarianteIframe) {
    // Desvío: el original hace document.cookie = 'sRotate=0' desde /line/view/<id>/iframe, así que la cookie
    // queda con path /line/view/<id> y no toca la rotación del juez ni de la firma. Acá todas las páginas
    // comparten carpeta: se acota el path a esta página para no pisar la cookie sRotate (path /) del juez.
    document.cookie = 'sRotate=0; path=' + location.pathname;
    window.tile_size = function tile_size() {
      $(function () {
        try {
            var tilesize_w = (window.innerWidth - 2 * width) / width;
            var tilesize_h = (window.innerHeight - 180) / length;
            if (tilesize_h > tilesize_w) var tilesize = tilesize_w;
            else var tilesize = tilesize_h;
            $('tile').css('height', tilesize);
            $('tile').css('width', tilesize);
            $('.tile-image').css('height', tilesize);
            $('.tile-image').css('width', tilesize);
            $('.tile-font').css('font-size', tilesize - 10);
            $('.tile-font-1-25').css('font-size', tilesize / 2.5);
            $('.tile-point').css('font-size', tilesize / 2 + "px");
            $('.slot').css('height', tilesize);
            $('.slot').css('width', tilesize);
            $('.chnumtxt').css('font-size', tilesize / 6);
            $('#wrapTile').css('width', (tilesize + 3) * width);
        } catch (e) {
            setTimeout("tile_size()", 1000);
        }
      });
    };
  }
</script>

<script>
  // [rcj-line-offline] D5, flag audioResume (08 §5.8 desvío 6): reanuda el AudioContext de sign/line_2026.js:1113
  // en el primer gesto (nace suspendido por la política de autoplay).
  (function () {
    if (!(window.RCJLocal && RCJLocal.flags && RCJLocal.flags.audioResume)) return;
    var eventos = ['pointerdown', 'mousedown', 'touchend', 'keydown'];
    function quitar() { eventos.forEach(function (ev) { document.removeEventListener(ev, reanudar, true); }); }
    function reanudar() {
      try {
        if (typeof context === 'undefined' || !context || context.state !== 'suspended') { quitar(); return; }
        context.resume().then(function () { if (context.state === 'running') quitar(); }, function () {});
      } catch (e) { quitar(); }
    }
    eventos.forEach(function (ev) { document.addEventListener(ev, reanudar, true); });
  })();
</script>

<script>
  // [rcj-line-offline] elige el cuerpo de la variante antes de que Angular arranque (DOMContentLoaded).
  (function () {
    var elegida = document.getElementById(rcjVarianteIframe ? 'rcj-variante-iframe' : 'rcj-variante-vista');
    var yo = document.currentScript;
    document.body.insertBefore(elegida.content.cloneNode(true), yo);
    ['rcj-variante-vista', 'rcj-variante-iframe'].forEach(function (id) {
      var t = document.getElementById(id);
      if (t) t.parentNode.removeChild(t);
    });
  })();
</script>
